<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StayOps · 物件清掃カレンダー</title>
  <style>
    :root {
      --bg: #101318;
      --panel: #171b22;
      --panel-2: #1d222b;
      --panel-3: #252b36;
      --line: rgba(255,255,255,.09);
      --text: #f5f3ee;
      --muted: #9299a7;
      --muted-2: #686f7d;
      --amber: #f3b85f;
      --amber-soft: rgba(243,184,95,.14);
      --coral: #f37f67;
      --coral-soft: rgba(243,127,103,.13);
      --mint: #8fd8bd;
      --mint-soft: rgba(143,216,189,.13);
      --blue: #8cb8ff;
      --blue-soft: rgba(140,184,255,.13);
      --shadow: 0 18px 55px rgba(0,0,0,.28);
      --radius: 18px;
      --radius-sm: 11px;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); min-width: 1080px; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    .app-shell { display: flex; min-height: 100vh; }
    .sidebar { width: 238px; background: #0d1014; border-right: 1px solid var(--line); padding: 28px 16px 20px; position: sticky; top: 0; height: 100vh; flex: 0 0 238px; }
    .brand { display:flex; align-items:center; gap: 11px; padding: 0 12px 30px; }
    .brand-mark { width: 34px; height:34px; border-radius: 10px; display:grid; place-items:center; color:#101318; background: linear-gradient(135deg, var(--amber), var(--coral)); font-weight: 900; letter-spacing:-1px; }
    .brand strong { display:block; font-size: 15px; letter-spacing:.03em; }
    .brand small { color:var(--muted-2); font-size:10px; letter-spacing:.11em; text-transform:uppercase; }
    .nav-label { color: var(--muted-2); font-size: 10px; text-transform: uppercase; letter-spacing: .13em; margin: 0 12px 9px; }
    .nav { display:grid; gap: 4px; margin-bottom: 30px; }
    .nav button { border: 0; color: var(--muted); background: transparent; padding: 11px 12px; border-radius: 10px; text-align:left; display:flex; align-items:center; gap: 11px; font-size: 13px; }
    .nav button:hover, .nav button.active { color:var(--text); background: var(--panel-2); }
    .nav button.active { box-shadow: inset 3px 0 var(--amber); }
    .nav-icon { width: 17px; text-align:center; color: var(--amber); font-size: 14px; }
    .sidebar-foot { position:absolute; bottom: 20px; left: 16px; right: 16px; }
    .sync-mini { border:1px solid var(--line); padding: 12px; border-radius: 13px; color:var(--muted); font-size: 11px; line-height: 1.5; background: rgba(255,255,255,.02); }
    .sync-mini b { display:block; color:var(--text); margin-bottom:4px; font-size:12px; }
    .status-dot { display:inline-block; width: 7px; height:7px; border-radius:50%; background:var(--mint); margin-right:5px; box-shadow: 0 0 0 3px var(--mint-soft); }
    .main { flex:1; padding: 30px 38px 45px; min-width: 0; }
    .topbar { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom: 29px; }
    .eyebrow { color: var(--amber); font-size: 11px; letter-spacing:.14em; text-transform:uppercase; margin-bottom: 9px; }
    h1 { margin:0; font-size: 28px; letter-spacing:-.035em; line-height:1.12; }
    .subline { color:var(--muted); font-size: 13px; margin-top:8px; }
    .top-actions { display:flex; align-items:center; gap:9px; flex-wrap:wrap; justify-content:flex-end; }
    .date-control, .role-control { display:flex; align-items:center; border:1px solid var(--line); background:var(--panel); border-radius: 10px; overflow:hidden; }
    .date-control button, .role-control button { color:var(--muted); background:transparent; border:0; padding:9px 11px; }
    .date-control button:hover, .role-control button:hover { color:var(--text); background:var(--panel-3); }
    .date-control .date-label { padding: 0 8px; min-width: 110px; text-align:center; font-size:12px; }
    .role-control button.active { background:var(--amber-soft); color:var(--amber); }
    .button-primary, .button-secondary, .button-quiet { border:0; border-radius: 10px; padding: 10px 14px; font-size:12px; color:var(--text); }
    .button-primary { background: var(--amber); color:#14161a; font-weight:800; }
    .button-primary:hover { filter: brightness(1.06); }
    .button-primary:disabled, .button-secondary:disabled { opacity:.45; cursor:not-allowed; filter:none; }
    .button-secondary { background:var(--panel-3); border:1px solid var(--line); }
    .button-quiet { background:transparent; color:var(--muted); padding-left:8px; padding-right:8px; }
    .button-quiet:hover { color:var(--text); background:var(--panel-3); }
    .summary-grid { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:14px; margin-bottom: 26px; }
    .summary-card { position:relative; overflow:hidden; padding: 20px 21px 18px; background:var(--panel); border:1px solid var(--line); border-radius: var(--radius); min-height: 143px; box-shadow:var(--shadow); }
    .summary-card::after { content:""; position:absolute; width:90px; height:90px; border-radius:50%; right:-28px; top:-26px; opacity:.12; background:var(--amber); }
    .summary-card.coral::after { background:var(--coral); }
    .summary-card.mint::after { background:var(--mint); }
    .summary-card .label { font-size:11px; color:var(--muted); display:flex; align-items:center; gap:7px; }
    .summary-card .count { font-size:34px; font-weight: 750; margin:14px 0 11px; letter-spacing:-.04em; }
    .summary-card .foot { font-size:11px; color:var(--muted-2); }
    .summary-card .foot b { color:var(--text); font-weight:500; }
    .pulse { width:8px; height:8px; border-radius:50%; background:var(--amber); box-shadow:0 0 0 5px var(--amber-soft); }
    .coral .pulse { background:var(--coral); box-shadow:0 0 0 5px var(--coral-soft); }
    .mint .pulse { background:var(--mint); box-shadow:0 0 0 5px var(--mint-soft); }
    .workspace-head { display:flex; align-items:center; justify-content:space-between; margin-bottom: 13px; }
    .workspace-head h2 { margin:0; font-size:15px; letter-spacing:-.01em; }
    .workspace-head .hint { color:var(--muted); font-size:11px; }
    .panel { border:1px solid var(--line); background:var(--panel); border-radius:var(--radius); box-shadow:var(--shadow); }
    .calendar-panel { overflow:hidden; }
    .calendar-top { display:flex; justify-content:space-between; align-items:center; padding:17px 18px; border-bottom:1px solid var(--line); }
    .calendar-top .legend { display:flex; gap:15px; color:var(--muted); font-size:11px; }
    .legend span { display:inline-flex; align-items:center; gap:6px; }
    .legend i { width:8px; height:8px; border-radius:50%; display:inline-block; }
    .legend .in { background:var(--blue); }
    .legend .clean { background:var(--amber); }
    .legend .manual { background:var(--mint); }
    .calendar-scroller { overflow-x:auto; }
    .calendar-head, .calendar-row { display:grid; grid-template-columns: 198px repeat(7, minmax(128px, 1fr)); min-width: 1100px; }
    .calendar-head { border-bottom:1px solid var(--line); background:#151920; }
    .calendar-head > div { padding:13px 12px; border-right:1px solid var(--line); }
    .calendar-head .room-head { color:var(--muted-2); font-size:10px; text-transform:uppercase; letter-spacing:.11em; }
    .day-head { display:flex; align-items:center; justify-content:space-between; gap:6px; }
    .day-head .day-name { color:var(--muted); font-size:11px; }
    .day-head .day-num { font-size:18px; font-weight:700; }
    .day-head.today .day-num { color:var(--amber); }
    .day-head.today { background:rgba(243,184,95,.05); }
    .calendar-row { position:relative; min-height:132px; border-bottom:1px solid var(--line); }
    .calendar-row:last-child { border-bottom:0; }
    .room-cell { padding:14px 13px; border-right:1px solid var(--line); background:#191d24; }
    .room-title { display:flex; align-items:center; gap:9px; }
    .room-avatar { width:29px; height:29px; border-radius:9px; display:grid; place-items:center; color:#16191d; font-weight:800; font-size:12px; }
    .room-name { font-weight:700; font-size:13px; }
    .room-code { color:var(--muted-2); font-size:10px; margin-top:2px; }
    .room-links { display:flex; flex-wrap:wrap; gap:5px; margin:13px 0 0 38px; }
    .room-links a, .room-links span { text-decoration:none; border:1px solid var(--line); color:var(--muted); border-radius:6px; padding:4px 7px; font-size:10px; }
    .room-links a:hover { color:var(--text); border-color:var(--amber); }
    .checklist-link { color:var(--amber); font-size:10px; border:0; background:transparent; padding:9px 0 0 38px; }
    .checklist-link:hover { text-decoration:underline; }
    .calendar-manage-link { color:var(--blue); font-size:10px; border:0; background:transparent; padding:7px 0 0 38px; }
    .calendar-manage-link:hover { text-decoration:underline; }
    .calendar-cell { position:relative; z-index:0; padding:8px; border-right:1px solid var(--line); background:#15191f; min-height:132px; }
    .calendar-cell.today { background:linear-gradient(180deg, rgba(243,184,95,.055), #15191f 55%); }
    .cell-add { position:absolute; z-index:3; right:8px; bottom:8px; width:23px; height:23px; border-radius:7px; border:1px dashed var(--muted-2); color:var(--muted); background:transparent; opacity:0; transition:.18s; }
    .calendar-cell:hover .cell-add, .cell-add:focus { opacity:1; }
    .cell-add:hover { color:var(--amber); border-color:var(--amber); }
    .event-card { position:relative; z-index:2; border:1px solid transparent; border-radius:9px; padding:8px 8px 7px; margin-bottom:6px; cursor:pointer; transition:.18s; }
    .event-card:hover { transform:translateY(-1px); border-color:rgba(255,255,255,.2); }
    .event-card.checkin { background:var(--blue-soft); border-left:3px solid var(--blue); }
    .event-card.cleaning { background:var(--amber-soft); border-left:3px solid var(--amber); }
    .event-card.manual { background:var(--mint-soft); border-left:3px solid var(--mint); }
    .event-type { display:flex; align-items:center; justify-content:space-between; gap:5px; font-size:9px; letter-spacing:.04em; color:var(--muted); margin-bottom:5px; }
    .event-type strong { color:var(--text); font-size:10px; }
    .event-title { font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .event-meta { color:var(--muted-2); font-size:9px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .stay-layer { position:absolute; z-index:1; left:198px; right:0; top:8px; bottom:8px; display:grid; align-content:stretch; pointer-events:none; }
    .stay-segment { min-width:0; height:25px; padding:0 8px; display:flex; align-items:center; overflow:hidden; background:var(--blue-soft); border-top:1px solid var(--blue); border-bottom:1px solid var(--blue); color:var(--text); font-size:10px; font-weight:700; white-space:nowrap; text-overflow:ellipsis; pointer-events:auto; cursor:pointer; }
    .stay-segment.start { border-left:3px solid var(--blue); border-top-left-radius:8px; border-bottom-left-radius:8px; }
    .stay-segment.end { border-right:3px solid var(--blue); border-top-right-radius:8px; border-bottom-right-radius:8px; }
    .stay-segment.start.end { justify-content:center; }
    .stay-segment:not(.start):not(.end) { padding:0; }
    .stay-segment { background:#eaf2ff; color:#31537a; }
    .stay-bar { min-width:0; height:100%; padding:0 11px; display:flex; align-items:center; gap:12px; overflow:hidden; background:#eaf2ff; border:2px solid var(--blue); border-radius:10px; color:#31537a; font-size:10px; font-weight:700; white-space:nowrap; pointer-events:auto; cursor:pointer; box-shadow:0 2px 5px rgba(75,125,190,.08); }
    .stay-bar > span { flex:0 0 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .stay-bar .stay-note { flex:1 1 120px; min-width:70px; }
    .stay-bar .stay-operations-note { flex:1 1 150px; min-width:95px; color:#7a3fa0; font-weight:900; }
    .stay-bar .stay-travel { color:#a76805; }
    .stay-bar .stay-linen { flex:0 0 auto; font-size:18px; line-height:1; }
    .stay-bar .stay-linen.done { color:#1c8b67; }
    .stay-bar .stay-linen.pending { color:#8a6a2a; }
    .stay-cleaning-status { flex:0 0 auto; font-size:19px; line-height:1; filter:saturate(1.15); }
    .schedule-employee-mark { display:inline-grid; place-items:center; min-width:17px; height:17px; margin-left:5px; padding:0 3px; border-radius:5px; background:var(--blue-soft); color:var(--blue); font-size:10px; font-weight:800; vertical-align:middle; }
    .done-mark { color:var(--mint); font-size:10px; }
    .empty-cell { color:var(--muted-2); font-size:10px; padding:7px 3px; opacity:.5; }
    .below-grid { display:grid; grid-template-columns: 1.05fr .95fr; gap:14px; margin-top:15px; }
    .quick-panel { padding:18px; min-height:180px; }
    .quick-panel h3 { margin:0 0 15px; font-size:14px; }
    .quick-list { display:grid; gap:9px; }
    .quick-item { display:flex; align-items:center; gap:10px; padding:9px 10px; background:rgba(255,255,255,.025); border-radius:9px; }
    .quick-item .mini-tag { min-width:42px; text-align:center; color:var(--amber); font-size:10px; }
    .quick-item .quick-text { flex:1; font-size:12px; }
    .quick-item small { color:var(--muted-2); font-size:10px; }
    .empty-state { color:var(--muted); padding:15px 0; font-size:12px; }
    .view-panel { padding:20px; }
    .filter-row { display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
    .filter-row input, .filter-row select, .form-input, .form-select, .form-textarea { border:1px solid var(--line); background:#11151a; color:var(--text); border-radius:9px; outline:none; padding:10px 11px; }
    .filter-row input:focus, .form-input:focus, .form-select:focus, .form-textarea:focus { border-color:var(--amber); }
    .supply-grid { display:grid; grid-template-columns: 1fr 1fr; gap:11px; }
    .supply-item { display:flex; gap:10px; align-items:center; padding:13px; background:rgba(255,255,255,.035); border:1px solid var(--line); border-radius:10px; }
    .supply-item.done { opacity:.48; }
    .supply-item.done .supply-name { text-decoration:line-through; }
    .supply-item input, .check-row input { accent-color: var(--amber); width:16px; height:16px; }
    .supply-source { margin-left:auto; color:var(--muted-2); font-size:10px; }
    .supply-room { flex:1; color:var(--muted); font-size:10px; }
    .supply-translation { color:var(--muted-2); font-size:10px; margin-left:4px; }
    .checklist-grid { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:12px; }
    .check-room { padding:17px; }
    .check-room-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:13px; }
    .check-room h3 { margin:0; font-size:14px; }
    .check-progress { color:var(--mint); font-size:10px; }
    .check-row { display:flex; align-items:center; gap:9px; padding:9px 0; border-top:1px solid var(--line); font-size:12px; color:var(--muted); }
    .check-room .button-quiet { margin-top:9px; }
    .sync-layout { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
    .sync-card { padding:18px; }
    .sync-card h3 { margin:0 0 6px; font-size:14px; }
    .sync-card p { color:var(--muted); font-size:11px; line-height:1.6; margin:0 0 15px; }
    .form-stack { display:grid; gap:10px; }
    .form-label { color:var(--muted); font-size:11px; display:block; margin-bottom:5px; }
    .form-textarea { width:100%; resize:vertical; min-height:170px; line-height:1.5; }
    .sync-actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
    .toast { position:fixed; right:25px; bottom:24px; z-index:20; background:#252b34; border:1px solid var(--line); padding:12px 15px; border-radius:10px; box-shadow:var(--shadow); color:var(--text); font-size:12px; animation: toast-in .2s ease; }
    @keyframes toast-in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    .modal-backdrop { position:fixed; inset:0; z-index:30; background:rgba(5,7,9,.72); display:grid; place-items:center; padding:25px; }
    .modal { background:#1b2028; width:min(600px, 100%); max-height:90vh; overflow:auto; border:1px solid var(--line); border-radius:18px; box-shadow:0 28px 90px rgba(0,0,0,.5); }
    .modal-head { display:flex; justify-content:space-between; align-items:flex-start; padding:20px 21px 15px; border-bottom:1px solid var(--line); }
    .modal-head h2 { margin:0; font-size:17px; }
    .modal-head p { color:var(--muted); font-size:11px; margin:6px 0 0; }
    .modal-close { background:transparent; border:0; color:var(--muted); font-size:21px; line-height:1; }
    .modal-close:hover { color:var(--text); }
    .modal-body { padding:19px 21px; }
    .modal-foot { display:flex; justify-content:space-between; gap:8px; padding:14px 21px 19px; border-top:1px solid var(--line); }
    .modal-foot .right { margin-left:auto; display:flex; gap:8px; }
    .form-grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    .form-full { grid-column: 1 / -1; }
    .check-edit-list { display:grid; gap:8px; }
    .check-edit-row { display:flex; gap:7px; align-items:center; }
    .check-edit-row input { flex:1; }
    .icon-danger { border:0; border-radius:8px; background:var(--coral-soft); color:var(--coral); width:34px; height:34px; }
    .password-note { color:var(--muted); font-size:11px; margin-top:9px; line-height:1.5; }
    .access-gate-root { min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); }
    .access-gate { width:min(460px,100%); padding:28px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
    .access-gate h1 { font-size:24px; margin:0; }
    .access-gate .access-subtitle { color:var(--muted); font-size:12px; line-height:1.6; margin:9px 0 19px; }
    .access-role-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; margin-bottom:16px; }
    .access-role-button { border:1px solid var(--line); border-radius:9px; background:var(--panel-2); color:var(--muted); padding:10px 6px; font-size:11px; }
    .access-role-button.active { color:var(--text); background:var(--amber-soft); border-color:var(--amber); font-weight:700; }
    .access-password-row { display:flex; gap:8px; align-items:end; }
    .access-password-row > div { flex:1; }
    .access-gate .language-control { width:max-content; margin-left:auto; margin-bottom:18px; }
    .access-locked-hint { color:var(--coral); font-size:11px; line-height:1.5; margin-top:10px; }
    @media (max-width:700px) { .access-gate-root { padding:14px; } .access-gate { padding:21px; } .access-role-grid { grid-template-columns:1fr; } .access-password-row { display:block; } .access-password-row .button-primary { width:100%; margin-top:10px; } }
    .notice { padding:11px 12px; border-radius:9px; background:var(--amber-soft); color:#f7d59d; font-size:11px; line-height:1.5; margin-bottom:14px; }
    .language-control { display:flex; align-items:center; border:1px solid var(--line); background:var(--panel); border-radius:10px; overflow:hidden; }
    .language-control button { border:0; color:var(--muted); background:transparent; padding:9px 10px; font-size:11px; }
    .language-control button.active { color:var(--text); background:var(--amber-soft); font-weight:700; }
    .language-control button:hover { color:var(--text); background:var(--panel-2); }
    .room-filter-control { display:flex; align-items:center; border:1px solid var(--line); background:var(--panel); border-radius:10px; overflow:hidden; padding:0 9px; gap:6px; }
    .room-filter-control label { color:var(--muted); font-size:10px; white-space:nowrap; }
    .room-filter-control select { border:0; outline:0; background:transparent; color:var(--text); padding:8px 2px; font-size:11px; max-width:145px; }
    .room-warning { display:none !important; }
    .stay-note-warning { flex:0 0 auto; display:inline-grid; place-items:center; width:18px; height:18px; border-radius:50%; background:#dc3f3f; color:#ffffff; font-size:12px; line-height:1; font-weight:900; box-shadow:0 2px 5px rgba(220,63,63,.28); }
    .calendar-cell.has-note { box-shadow:inset 0 3px 0 var(--amber); }
    /* Light workspace theme */
    :root {
      --bg:#f5f7fa;
      --panel:#ffffff;
      --panel-2:#f0f3f7;
      --panel-3:#e6ebf1;
      --line:rgba(25,36,52,.12);
      --text:#1d2735;
      --muted:#687487;
      --muted-2:#8c97a7;
      --shadow:0 15px 38px rgba(28,43,64,.08);
    }
    body { background:var(--bg); color:var(--text); }
    .sidebar { background:#ffffff; }
    .sync-mini { background:rgba(25,36,52,.025); }
    .calendar-head { background:#f4f6f9; }
    .room-cell { background:#f8fafc; }
    .calendar-cell { background:#ffffff; }
    .calendar-cell.today { background:linear-gradient(180deg, rgba(243,184,95,.12), #ffffff 55%); }
    .event-card:hover { border-color:rgba(25,36,52,.18); }
    .filter-row input, .filter-row select, .form-input, .form-select, .form-textarea { background:#ffffff; color:var(--text); }
    .modal-backdrop { background:rgba(15,23,42,.34); }
    .modal { background:#ffffff; }
    .notice { color:#8a5b0a; }
    .toast { background:#263140; color:#ffffff; }
    .finance-panel { display:flex; align-items:center; justify-content:space-between; gap:18px; margin:0 0 26px; padding:18px 20px; }
    .finance-metrics { display:flex; gap:28px; align-items:center; }
    .finance-metric small { display:block; color:var(--muted); font-size:10px; margin-bottom:5px; }

        ['role','accessRole','language','activeView','roomFilter','viewStart','calendarEnd','activeStaffId','accountingStart','accountingEnd','profitMonth','scheduleMonth','scheduleEmployeeFilter'].forEach(key => delete payload[key]);
        return payload;
      }
      function queueRemoteSave() {
        if (!backendAvailable) return;
        clearTimeout(remoteSaveTimer);
        remoteSaveTimer = setTimeout(() => {
          fetch('/api/state', {method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(sharedStatePayload())}).catch(() => {});
        }, 250);
      }
      function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); writeAutoBackup(); queueRemoteSave(); }
      function downloadBackup() {
        const blob = new Blob([JSON.stringify(backupPayload(), null, 2)], {type:'application/json;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'StayOps备份_' + today + '.json';
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        toast(state.language === 'ja' ? 'バックアップをダウンロードしました' : '备份文件已下载');
      }
      function restoreBackupData(imported) {
        if (!imported || !Array.isArray(imported.rooms) || !Array.isArray(imported.reservations)) throw new Error('invalid backup');
        if (!window.confirm(state.language === 'ja' ? 'このバックアップで現在のローカルデータを上書きしますか？' : '确定用这个备份覆盖当前本地数据吗？')) return;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(imported));
        window.location.reload();
      }
      function restoreBackupFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const payload = JSON.parse(reader.result);
            restoreBackupData(payload.state || payload);
          } catch {
            toast(state.language === 'ja' ? 'バックアップファイルを読み込めません' : '备份文件格式不正确');
          }
        };
        reader.readAsText(file);
      }
      function restoreAutoBackup() {
        try {
          const payload = JSON.parse(localStorage.getItem(BACKUP_KEY) || 'null');
          if (!payload?.state) throw new Error('missing backup');
          restoreBackupData(payload.state);
        } catch {
          toast(state.language === 'ja' ? '自動バックアップがありません' : '没有可恢复的自动备份');
        }
      }

      function getRoom(id) { return state.rooms.find(room => room.id === id); }
      function visibleRooms() {
        const activeAccount = state.staffAccounts.find(account => account.id === state.activeStaffId);
        const allowed = state.role === 'cleaner' ? (activeAccount?.roomIds || []) : state.rooms.map(room => room.id);
        return state.rooms.filter(room => allowed.includes(room.id) && (state.roomFilter === 'all' || room.id === state.roomFilter));
      }
      function eventHasNote(event) { return eventNotes(event, 'all').length > 0; }
      function roomHasNote(roomId, date) { return eventsOn(date, roomId).some(eventHasNote); }
      function getEvents() {
        const events = [];
        state.reservations.forEach(stay => {
          events.push({id:`${stay.id}-in`,baseId:stay.id,type:'checkin',date:stay.checkIn,roomId:stay.roomId,guest:stay.guest,source:stay.source,stay});
          events.push({id:`${stay.id}-clean`,baseId:stay.id,type:'cleaning',date:stay.checkOut,roomId:stay.roomId,guest:stay.guest,source:stay.source,stay});
        });
        state.manualEvents.forEach(event => events.push({...event,type:event.type || 'manual',source:'manual'}));
        return events;
      }
      function eventMetaKeys(event) {
        if (!event?.id) return [];
        const keys = [event.id];
        if (event.type === 'cleaning' && event.baseId) keys.push(event.baseId + '-clean', event.baseId);
        if (event.type === 'checkin' && event.baseId) keys.push(event.baseId + '-in');
        return [...new Set(keys)];
      }
      function getMeta(event) {
        const fallback = {status:'pending',note:'',assignee:''};
        const key = eventMetaKeys(event).find(id => state.eventMeta[id] && typeof state.eventMeta[id] === 'object');
        return key ? state.eventMeta[key] : fallback;
      }
      function getScheduleMeta(event) {
        if (!event) return {};
        return state.scheduleMeta?.[event.id] || (event.baseId ? state.scheduleMeta?.[event.baseId] : null) || {};
      }
      function assignedEmployee(event) {
        const meta = getMeta(event || {id:''});
        const schedule = getScheduleMeta(event);
        const account = state.staffAccounts.find(item => item.id === schedule.employeeId || item.id === meta.employeeId || item.name === schedule.employeeName || item.name === meta.employeeName);
        return String(schedule.employeeName || schedule.employee || meta.employeeName || account?.name || '').trim();
      }
      function syncLinenMarkers() {
        let changed = false;
        state.rooms.forEach(room => {
          const upcoming = getEvents().filter(event => event.roomId === room.id && event.type === 'cleaning' && event.date >= today).sort((a,b) => a.date.localeCompare(b.date));
          if (!upcoming.some(event => Boolean(getMeta(event).linenDelivered))) return;
          const target = upcoming[0];
          upcoming.forEach(event => {
            const next = event.id === target.id;
            const current = Boolean(getMeta(event).linenDelivered);
            if (current !== next) {
              state.eventMeta[event.id] = {...getMeta(event),linenDelivered:next};
              changed = true;
            }
          });
        });
        if (changed) save();
      }
      function eventsOn(date, roomId) {
        const allowed = new Set(visibleRooms().map(room => room.id));
        return getEvents().filter(e => e.date === date && allowed.has(e.roomId) && (!roomId || e.roomId === roomId));
      }
      function isToday(date) { return date === today; }
      function calendarEndDate() { const end = state.calendarEnd || addDays(state.viewStart, 6); return end >= state.viewStart ? end : state.viewStart; }
      function calendarDays() {
        const days = [];
        const end = calendarEndDate();
        let cursor = state.viewStart;
        while (cursor <= end) { days.push(cursor); cursor = addDays(cursor, 1); }
        return days;
      }
      function calendarRangeLength() { return calendarDays().length || 1; }
      function sourceLabel(source) {
        if (sourceNames[source]) return sourceNames[source];
        const calendar = state.rooms.flatMap(room => room.calendars || []).find(item => item.id === source);
        return calendar?.name || source || '手动';
      }

      function applyLanguage() {
        document.documentElement.lang = state.language;
        document.title = state.language === 'ja' ? 'StayOps · 物件清掃カレンダー' : 'StayOps · 房源清洁日历';
        document.querySelectorAll('[data-i18n]').forEach(element => { element.textContent = t(element.dataset.i18n); });
        document.querySelectorAll('[data-language]').forEach(button => button.classList.toggle('active', button.dataset.language === state.language));
        document.getElementById('prev-day').setAttribute('aria-label', state.language === 'ja' ? '前の日' : '前一天');
        document.getElementById('next-day').setAttribute('aria-label', state.language === 'ja' ? '次の日' : '后一天');
      }
      function renderRoomFilter() {
        const select = document.getElementById('room-filter');
        const activeAccount = state.staffAccounts.find(account => account.id === state.activeStaffId);
        const allowed = state.role === 'cleaner' ? (activeAccount?.roomIds || []) : state.rooms.map(room => room.id);
        if (state.roomFilter !== 'all' && !allowed.includes(state.roomFilter)) state.roomFilter = 'all';
        select.innerHTML = '<option value="all">' + (state.language === 'ja' ? 'すべての物件' : '全部房源') + '</option>' + state.rooms.filter(room => allowed.includes(room.id)).map(room => '<option value="' + room.id + '">' + escapeHtml(room.name) + '</option>').join('');
        select.value = state.roomFilter;
        document.getElementById('staff-access').style.display = state.role === 'admin' ? '' : 'none';
        document.getElementById('admin-security').style.display = state.role === 'admin' ? '' : 'none';
        document.getElementById('accounts-nav').style.display = state.role === 'admin' ? '' : 'none';
        document.getElementById('schedule-nav').style.display = state.role === 'admin' ? '' : 'none';
        const accountControl = document.getElementById('staff-account-control');
        accountControl.style.display = 'none';
        const accountSelect = document.getElementById('staff-account');

        accountSelect.value = state.activeStaffId;
        accountSelect.disabled = true;
      }
      function roleCanView(view) {
        if (state.role === 'admin') return true;
        if (state.role === 'operations') return ['calendar','linen','checklists','sync'].includes(view);
        return ['calendar','checklists'].includes(view);
      }
      function applyRoleViewPermissions() {
        document.querySelectorAll('[data-view]').forEach(button => { button.style.display = roleCanView(button.dataset.view) ? '' : 'none'; });
        if (state.activeView === 'supplies') state.activeView = 'calendar';

      }
      function roomHasAnyNote(roomId) { return getEvents().some(event => event.roomId === roomId && eventNotes(event, 'all').length > 0); }
      function renderAccessGate() {
        const isJa = state.language === 'ja';

        const lockedHint = record?.locked ? '<div class="access-locked-hint">' + (selected === 'admin' ? (isJa ? '管理者アカウントはロック中です。解除には緊急解除パスワードを使用してください。' : '管理员账号已锁定，请使用终极密码解锁。') : (isJa ? 'このアカウントはロック中です。管理者による再設定が必要です。' : '这个账号已锁定，需要管理员重新设置。')) + '</div>' : '';
        return '<main class="access-gate"><div class="language-control" aria-label="Language"><button data-language="ja" class="' + (isJa ? 'active' : '') + '">日本語</button><button data-language="zh" class="' + (!isJa ? 'active' : '') + '">中文</button></div><div class="eyebrow">StayOps</div><h1>' + (isJa ? '権限ログイン' : '权限登录') + '</h1><p class="access-subtitle">' + (isJa ? '権限を選択してパスワードを入力してください。ログイン後は、この画面で別の権限を選ぶまで現在の権限を保持します。' : '请选择权限并输入密码。登录后会保持当前权限，直到你主动切换到其他权限。') + '</p><div class="access-role-grid">' + roleButtons + '</div><div class="access-password-row"><div><label class="form-label">' + (isJa ? 'パスワード' : '密码') + '</label><input class="form-input" id="access-password" type="password" autocomplete="current-password" placeholder="' + (isJa ? '入力してください' : '请输入密码') + '" style="width:100%"/></div><button class="button-primary" data-action="unlock-access">' + (isJa ? 'ログイン' : '进入系统') + '</button></div>' + lockedHint + '</main>';
      }
      function render() {

      }

      function renderSummary() {
        const cleaning = eventsOn(today).filter(e => e.type === 'cleaning');
        const checkins = eventsOn(today).filter(e => e.type === 'checkin');
        const turnaround = visibleRooms().filter(room => cleaning.some(e => e.roomId === room.id) && checkins.some(e => e.roomId === room.id));

      function renderAccounting() {
        if (state.role !== 'admin') return '<section class="panel view-panel"><div class="empty-state">只有管理员可以查看财务页面。</div></section>';
        const rows = accountingRows();

      function parseICS(text, roomId, source) {
        const unfolded = text.replace(/\r?\n[ \t]/g, '').split(/\r?\n/); const blocks=[]; let current=null;
        unfolded.forEach(line => { if(line === 'BEGIN:VEVENT') current={}; else if(line === 'END:VEVENT' && current){ blocks.push(current); current=null; } else if(current){ const idx=line.indexOf(':'); if(idx>0){ const rawKey=line.slice(0,idx).split(';')[0].toUpperCase(); current[rawKey]=line.slice(idx+1).trim(); } } });
        return blocks.map(block => { const start=parseICSDate(block.DTSTART), end=parseICSDate(block.DTEND); if(!start || !end) return null; return {id:uid('stay'),roomId,source,guest:(block.SUMMARY || '平台预订').replace(/^Reservation\s*:?\s*/i,''),checkIn:start,checkOut:end,uid:block.UID || uid('ical')}; }).filter(Boolean);

        render();
        toast((state.language === 'ja' ? '取込完了：' : '导入完成：') + fresh.length + (state.language === 'ja' ? ' 件' : ' 条订单'));

      function fetchWithTimeout(url, timeoutMs = 7000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);

      async function syncRoomCalendars(roomId) {
        if (state.role !== 'admin') return;
        const room = getRoom(roomId);

        const feeds = normalizeRoomCalendars(room).map(calendar => ({calendar,url:calendar.ical || calendar.url})).filter(item => item.url);
        if (!feeds.length) { toast(state.language === 'ja' ? '先に iCal または公開リンクを登録してください' : '请先登记 iCal 或公开日历链接'); return; }

        let added = 0;
        let failed = 0;
        for (const feed of feeds) {
          try {
            const response = await fetchWithTimeout(feed.url);
            if (!response.ok) throw new Error('fetch failed');
            const imported = parseICS(await response.text(), room.id, feed.calendar.id);

                added += 1;

          } catch {
            failed += 1;
          }
        }
        if (added) { save(); render(); }
        if (failed && !added) {
          toast(state.language === 'ja' ? 'ブラウザの制限で読み込めません。iCal 内容を貼り付けてください' : '浏览器无法直接读取，请粘贴 .ics 内容导入');

          if(state.role === 'cleaner') return;
          const item = getEvents().find(event => event.id === target.dataset.event);
          if(item) {
            const meta = getMeta(item);
            const delivered = !meta.linenDelivered;
            state.eventMeta[item.id] = {...meta, linenDelivered:delivered, linenSorted:delivered ? true : meta.linenSorted};
            syncLinenMarkers();
            save();
            render();
            toast(state.language === 'ja' ? '配達状態を更新しました' : '床品送达状态已更新');
          }
          return;
        }
        if(action === 'edit-checklist') { if(state.role !== 'admin') { toast('请切换为管理员'); return; } if(!verifyAdmin()) { toast('密码不正确，未进入编辑'); return; } openChecklist(target.dataset.room); return; }
        if(action === 'add-room') { openAddRoom(); return; }
        if(action === 'start-cleaning' || action === 'finish-cleaning') {
          if(state.role !== 'cleaner') return;
          const item=getEvents().find(event => event.id === target.dataset.event);
          if(!item || item.type !== 'cleaning') return;
          if(action === 'finish-cleaning') {
            openChecklist(item.roomId, {finishEventId:item.id});
            return;
          }
          const current=getMeta(item);
          const account=state.staffAccounts.find(entry => entry.id === state.activeStaffId);
          const employeeName=account?.name || current.employeeName || '';
          state.eventMeta[item.id]={...current,cleaningStarted:true,cleaningFinished:false,status:'pending',employeeId:state.activeStaffId,employeeName};
          save(); closeModal(); render(); toast(state.language === 'ja' ? '清掃を開始しました' : '清扫已开始'); return;
        }
        if(action === 'confirm-finish-cleaning') {
          if(state.role !== 'cleaner') return;
          const item=getEvents().find(event => event.id === target.dataset.event);
          if(!item || item.type !== 'cleaning') return;
          if(!checklistComplete(item.roomId, item.id)) {
            toast(state.language === 'ja' ? 'チェックリストをすべて確認してください' : '请先勾选全部清洁检查项');
            updateChecklistFinishButton();
            return;
          }
          const current=getMeta(item);
          const account=state.staffAccounts.find(entry => entry.id === state.activeStaffId);
          const employeeName=account?.name || current.employeeName || '';
          state.eventMeta[item.id]={...current,cleaningStarted:true,cleaningFinished:true,status:'done',employeeId:state.activeStaffId,employeeName};
          save(); closeModal(); render(); toast(state.language === 'ja' ? '清掃を終了しました' : '清扫已结束'); return;
        }
        if(action === 'save-event') {
          const id=target.dataset.event; const note=document.getElementById('event-note')?.value.trim() || ''; const status=document.getElementById('event-status')?.value || 'pending'; const travelEditor=document.getElementById('travel-cost-list'); const allowanceEditorList=document.getElementById('allowance-list'); const travelCosts=travelEditor ? Array.from(travelEditor.querySelectorAll('.travel-cost-input')).map(input => Number(input.value || 0)).filter(amount => Number.isFinite(amount) && amount >= 0).map(amount => ({id:uid('travel'),amount})) : null; const otherAllowances=allowanceEditorList ? Array.from(allowanceEditorList.querySelectorAll('.allowance-input')).map(input => Number(input.value || 0)).filter(amount => Number.isFinite(amount) && amount >= 0).map(amount => ({id:uid('allowance'),amount})) : null;
          if(state.role === 'cleaner') {
            const item=getEvents().find(e=>e.id===id);
            if(!item || item.type !== 'cleaning') return;
            const current=getMeta(item); const account=state.staffAccounts.find(entry => entry.id === state.activeStaffId); const employeeName=account?.name || current.employeeName || '';
            state.eventMeta[item.id]={...current,note,cleanerNote:note,cleanerNoteDate:today,noteUpdatedDate:today,noteSource:'cleaner',...(travelCosts ? {travelCosts} : {}),...(otherAllowances ? {otherAllowances} : {}),employeeId:state.activeStaffId,employeeName};
            save(); closeModal(); render(); toast(state.language === 'ja' ? 'メモ・交通費・その他手当を保存しました' : '备注、车费和其他补贴已保存'); return;
          }
          if(id){ const item=getEvents().find(e=>e.id===id); const current=item ? getMeta(item) : (state.eventMeta[id] || {}); const noteFields=state.role === 'operations' ? {note,operationsNote:note,operationsNoteDate:today,noteUpdatedDate:today,noteSource:'operations'} : {note,adminNote:note,adminNoteDate:today,noteUpdatedDate:today,noteSource:'admin'}; state.eventMeta[id]={...current,...noteFields,status,...(travelCosts ? {travelCosts} : {}),...(otherAllowances ? {otherAllowances} : {})}; if(item?.type==='manual'){ const manual=state.manualEvents.find(x=>x.id===id); if(manual) manual.title=document.getElementById('event-title')?.value.trim() || '手动安排'; } }
          else { state.manualEvents.push({id:uid('manual'),roomId:target.dataset.newRoom,date:target.dataset.newDate,title:document.getElementById('event-title')?.value.trim() || '手动安排'}); const newId=state.manualEvents.at(-1).id; state.eventMeta[newId]={note,noteSource:'admin',status,...(travelCosts ? {travelCosts} : {}),...(otherAllowances ? {otherAllowances} : {})}; }
          save(); closeModal(); render(); toast('日历备注已保存'); return;
        }
        if(action === 'save-new-stay') {
          if(state.role !== 'admin') return;
          const roomId=document.getElementById('new-stay-room')?.value;
          const source=document.getElementById('new-stay-source')?.value || 'manual';
          const checkIn=document.getElementById('new-stay-checkin')?.value;
          const checkOut=document.getElementById('new-stay-checkout')?.value;
          if(!roomId || !/^\d{4}-\d{2}-\d{2}$/.test(checkIn || '') || !/^\d{4}-\d{2}-\d{2}$/.test(checkOut || '') || checkIn >= checkOut) {
            toast(state.language === 'ja' ? '物件と日付を正しく入力してください' : '请正确填写房源和入住、退房日期');
            return;
          }
          state.reservations.push({id:uid('stay'),roomId,source,guest:'',checkIn,checkOut,uid:uid('manual-stay')});
          save(); closeModal(); render(); toast(state.language === 'ja' ? '宿泊予定を追加しました' : '住宿条已添加'); return;
        }
        if(action === 'delete-event') { const id=document.querySelector('[data-action="save-event"]')?.dataset.event; state.manualEvents=state.manualEvents.filter(x=>x.id!==id); delete state.eventMeta[id]; save(); closeModal(); render(); toast('手动安排已删除'); return; }
        if(action === 'add-new-room-calendar') { const list=document.getElementById('new-room-calendar-list'); if(list){ const isJa=state.language === 'ja'; list.insertAdjacentHTML('beforeend','<div class="new-room-calendar-row" style="display:flex;align-items:center;gap:8px;margin-top:8px"><input class="form-input new-room-calendar-link" type="url" placeholder="' + (isJa ? '日程リンクまたは iCal URL' : '粘贴日历链接或 iCal 地址') + '" style="width:100%"/><button class="icon-danger" data-action="remove-new-room-calendar" title="' + (isJa ? '削除' : '删除') + '">×</button></div>'); } return; }
        if(action === 'remove-new-room-calendar') { const row=target.closest('.new-room-calendar-row'); const list=document.getElementById('new-room-calendar-list'); if(row && list){ if(list.querySelectorAll('.new-room-calendar-row').length > 1) row.remove(); else { const input=row.querySelector('.new-room-calendar-link'); if(input) input.value=''; } } return; }
        if(action === 'save-room') { const name=document.getElementById('room-name')?.value.trim(); if(!name){toast(state.language === 'ja' ? '物件名を入力してください' : '请填写房源名称');return;} const links=Array.from(document.querySelectorAll('.new-room-calendar-link')).map(input=>input.value.trim()).filter(Boolean); const roomId=uid('room'); const room={id:roomId,name,code:'R-' + String(state.rooms.length + 1).padStart(2,'0'),color:colors[state.rooms.length % colors.length],calendars:links.map((url,index)=>({id:uid('calendar'),name:(state.language === 'ja' ? '日程' : '日历') + (index + 1),url,ical:url})),bookingUrl:'',airbnbUrl:'',bookingIcal:links[0] || '',airbnbIcal:links[1] || '',cleaningFee:180,cleaningWage:80,linen:{...defaultLinen}}; state.rooms.push(room); state.checklists[room.id]=[]; save(); closeModal(); render(); toast(state.language === 'ja' ? '物件を追加しました' : '房源已添加'); if(links.length) syncRoomCalendars(room.id); return; }
        if(action === 'toggle-supply') { const name=target.dataset.supply; const key=today+'-done'; state.supplies[key]=state.supplies[key]||[]; state.supplies[key]=target.checked ? [...new Set([...state.supplies[key],name])] : state.supplies[key].filter(x=>x!==name); save(); render(); return; }
        if(action === 'add-supply') { const input=document.getElementById('new-supply'); const name=input?.value.trim(); if(!name){toast('先写一个补给品名称');return;} state.supplies[today]=[...new Set([...(state.supplies[today]||[]),name])]; save(); render(); toast('已加入今日补给清单'); return; }
        if(action === 'save-checklist') { const roomId=target.dataset.room; const next=[]; document.querySelectorAll('.check-edit-row').forEach(row=>{ const input=row.querySelector('.check-edit-input'); if(input && input.value.trim()) next.push({id:input.dataset.checkId,label:input.value.trim(),checked:(state.checklists[roomId]||[]).find(x=>x.id===input.dataset.checkId)?.checked||false}); }); state.checklists[roomId]=next; save(); closeModal(); render(); toast('清洁检查表已保存'); return; }
        if(action === 'add-check') { const list=document.getElementById('check-edit-list'); const row=document.createElement('div'); row.className='check-edit-row'; row.innerHTML=`<input class="form-input check-edit-input" data-check-id="${uid('check')}" placeholder="新的检查项目"/><button class="icon-danger" data-action="remove-check">×</button>`; list.appendChild(row); return; }
        if(action === 'remove-check') { target.closest('.check-edit-row')?.remove(); return; }
        if(action === 'import-ics') { const text=document.getElementById('ics-text')?.value.trim(); const roomId=document.getElementById('ics-room')?.value; const calendarId=document.getElementById('ics-calendar')?.value; if(!text){toast(t('pasteICS'));return;} if(!calendarId){toast(t('noFeed'));return;} const imported=parseICS(text,roomId,calendarId); if(!imported.length){toast(t('noICS'));return;} const existing=new Set(state.reservations.map(x=>x.uid)); const fresh=imported.filter(x=>!existing.has(x.uid)); state.reservations.push(...fresh); save(); render(); toast(t('imported',{count:fresh.length}) + (fresh.length!==imported.length ? t('skipped') : '')); return; }
        if(action === 'fetch-ics') { const roomId=document.getElementById('ics-room')?.value, calendarId=document.getElementById('ics-calendar')?.value, room=getRoom(roomId), calendar=(room?.calendars || []).find(item => item.id === calendarId), url=calendar?.ical || calendar?.url; if(!url){toast(t('noFeed'));return;} fetchWithTimeout(url).then(r=>{if(!r.ok) throw new Error('fetch failed'); return r.text();}).then(text=>{const input=document.getElementById('ics-text'); if(input) input.value=text; toast(t('readICS'));}).catch(()=>toast(t('crossOrigin'))); return; }
        if(action === 'save-feeds') { saveFeedInputs(); return; }
        if(action === 'import-ics') { const text=document.getElementById('ics-text')?.value.trim(); if(!text){toast('请先粘贴 iCalendar 文本');return;} const imported=parseICS(text,document.getElementById('ics-room').value,document.getElementById('ics-source').value); if(!imported.length){toast('没有解析到有效的入住记录');return;} const existing=new Set(state.reservations.map(x=>x.uid)); const fresh=imported.filter(x=>!existing.has(x.uid)); state.reservations.push(...fresh); save(); render(); toast(`已导入 ${fresh.length} 条入住记录${fresh.length!==imported.length?'，重复记录已跳过':''}`); return; }
        if(action === 'fetch-ics') { const roomId=document.getElementById('ics-room').value, source=document.getElementById('ics-source').value, room=getRoom(roomId), url=room?.[source+'Ical']; if(!url){toast('这个房源还没有保存对应的 iCal 地址');return;} fetchWithTimeout(url).then(r=>{if(!r.ok) throw new Error('fetch failed'); return r.text();}).then(text=>{document.getElementById('ics-text').value=text;toast('已读取 iCal 文本，请点击导入')}).catch(()=>toast('浏览器拦截了跨域读取，请复制 .ics 文本后粘贴导入')); return; }
      });
      document.addEventListener('keydown', event => { if(event.key === 'Enter' && event.target?.id === 'access-password') document.querySelector('[data-action="unlock-access"]')?.click(); });
      document.addEventListener('change', event => { const t=event.target; if(t.id === 'room-filter'){ state.roomFilter=t.value; save(); render(); return; } if(t.id === 'staff-account'){ state.activeStaffId=t.value; state.roomFilter='all'; save(); render(); return; } if(t.id === 'ics-room'){ const calendarSelect=document.getElementById('ics-calendar'); if(calendarSelect) calendarSelect.innerHTML=calendarOptionsForRoom(t.value); return; } if(t.id === 'ics-file'){ const file=t.files?.[0]; const roomId=document.getElementById('ics-room')?.value; const calendarId=document.getElementById('ics-calendar')?.value; if(!file) return; const reader=new FileReader(); reader.onload=()=>importIcsContent(String(reader.result || ''),roomId,calendarId); reader.onerror=()=>toast(state.language === 'ja' ? 'ファイルを読み込めません' : '无法读取该文件'); reader.readAsText(file); return; } if(t.id === 'backup-file'){ restoreBackupFile(t.files?.[0]); t.value=''; return; } if(t.dataset.action === 'schedule-employee' || t.dataset.action === 'schedule-note'){ const item=getEvents().find(e=>e.id===t.dataset.event); if(item){ const current=getScheduleMeta(item); if(t.dataset.action === 'schedule-employee'){ const value=String(t.value || '').trim(); const account=state.staffAccounts.find(entry=>entry.id===value || entry.name===value); const employeeName=account?.name || value; state.scheduleMeta[item.id]={...current,employeeId:account?.id || '',employeeName,employee:employeeName}; } else { state.scheduleMeta[item.id]={...current,note:String(t.value || '').trim()}; } save(); render(); } return; } if(t.dataset.action === 'toggle-check'){ const item=(state.checklists[t.dataset.room]||[]).find(x=>x.id===t.dataset.check); if(item){ if(t.dataset.event){ const current=getMeta({id:t.dataset.event}); const progress={...(current.cleaningChecklist || {}),[item.id]:t.checked}; state.eventMeta[t.dataset.event]={...current,cleaningChecklist:progress}; } else { item.checked=t.checked; } save(); render(); updateChecklistFinishButton(); } } });
      document.getElementById('prev-day').addEventListener('click',()=>{const length=calendarRangeLength();state.viewStart=addDays(state.viewStart,-1);state.calendarEnd=addDays(state.viewStart,length-1);save();render();});
      document.getElementById('next-day').addEventListener('click',()=>{const length=calendarRangeLength();state.viewStart=addDays(state.viewStart,1);state.calendarEnd=addDays(state.viewStart,length-1);save();render();});
      document.getElementById('today-btn').addEventListener('click',()=>{const length=calendarRangeLength();state.viewStart=addDays(today,-1);state.calendarEnd=addDays(state.viewStart,length-1);save();render();});
      document.getElementById('add-room').addEventListener('click',()=>openAddRoom());
      writeAutoBackup();
      if (backendAvailable) queueRemoteSave();
      render();
    })();
  </script>
